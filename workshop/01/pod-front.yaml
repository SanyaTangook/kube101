# ตัวอย่าง Pod พื้นฐาน
# Pod คือหน่วยเล็กที่สุดใน Kubernetes
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: default
  labels:
    app: pos-frontend
spec:
  containers:
    - name: pos-frontend
      image: frontend:1.1 
      ports:
        - containerPort: 3000
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
