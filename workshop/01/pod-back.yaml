# ตัวอย่าง Pod พื้นฐาน
# Pod คือหน่วยเล็กที่สุดใน Kubernetes
apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  namespace: default
  labels:
    app: pos-backend
spec:
  containers:
    - envFrom:
       - configMapRef:
          name: pos-config
      name: pos-backend
      image: pos-backend:1.0 
      ports:
        - containerPort: 8080
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
