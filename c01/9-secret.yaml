# ตัวอย่าง Secret
# Secret ใช้เก็บ sensitive data เช่น password, token, SSH key, etc.

---
# Secret แบบ Opaque (default) - สำหรับเก็บ arbitrary data
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  # ค่า base64 encoded
  # echo -n 'admin' | base64 → YWRtaW4=
  # echo -n 'password123' | base64 → cGFzc3dvcmQxMjM=
  username: YWRtaW4=
  password: cGFzc3dvcmQxMjM=
  database-url: cG9zdGdyZXM6Ly91c2VyOnBhc3NAZGIuZXhhbXBsZS5jb206NTQzMi9teWRi

---
# Secret แบบ StringData - ค่า plaintext (Kubernetes จะ encode)
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: default
type: Opaque
stringData:
  # ค่าแบบ plaintext
  api-key: "sk_live_51234567890abcdef"
  api-secret: "secret_key_xyz"
  slack-webhook: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

---
# Secret สำหรับ Docker Registry (Image Pull)
apiVersion: v1
kind: Secret
metadata:
  name: docker-secret
  namespace: default
type: kubernetes.io/dockercfg
data:
  .dockercfg: eyJkb2NrZXIuaW8iOnsidXNlcm5hbWUiOiJ1c2VybmFtZSIsInBhc3N3b3JkIjoicGFzc3dvcmQiLCJlbWFpbCI6ImVtYWlsQGV4YW1wbGUuY29tIiwiYXV0aCI6ImRYTmxjaTFzYjJOYkoyOVNSMjkySyJ9fQ==

---
# Secret สำหรับ TLS/SSL
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate
  tls.crt: LS0tLS1CRUdJTi... (base64 encoded cert)
  # Base64 encoded TLS key
  tls.key: LS0tLS1CRUdJTi... (base64 encoded key)

---
# Secret สำหรับ SSH
apiVersion: v1
kind: Secret
metadata:
  name: ssh-secret
  namespace: default
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: LS0tLS1CRUdJTi... (base64 encoded private key)

---
# Secret สำหรับ Basic Auth
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: admin123

---
# Deployment ที่ใช้ Secret ผ่าน Environment Variables
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-secrets
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      # ใช้ ImagePullSecrets สำหรับ private registry
      imagePullSecrets:
      - name: docker-secret
      
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        
        # วิธี 1: ใช้ environment variables จาก Secret
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: api-key
        
        # วิธี 2: Mount Secret เป็น volume (file)
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
      
      volumes:
      - name: secret-volume
        secret:
          secretName: app-secrets
          defaultMode: 0400  # read-only for owner
      - name: tls-certs
        secret:
          secretName: tls-secret
          defaultMode: 0400
